<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #111; color: #eee; font-family: sans-serif; padding: 40px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; }
  .card { background: #222; padding: 20px; border-radius: 8px; text-align: center; }
  .stage { 
    display: inline-block; 
    border: 1px solid #444; 
    background: #1a1a1a;
    padding: 20px;
    border-radius: 8px;
  }
  svg { 
    width: 168px; /* 28 * 6 */
    height: 96px; /* 16 * 6 */
    overflow: visible; 
  }
  .solid { fill: #88c0d0; }
  .outline { fill: none; stroke: #88c0d0; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
  <div class="grid">
    
    <div class="card">
      <h3>1. The Classic Silhouette</h3>
      <div class="stage">
        <svg viewBox="0 0 28 16">
          <path class="solid" d="
            M 4 14
            C 4 11, 6 9, 8 9
            C 8 6, 10 4, 12 4
            C 14 4, 15 5, 16 6
            C 18 6, 20 7, 22 8
            C 24 7, 26 8, 26 11
            C 26 13, 25 14, 23 14
            C 18 13.5, 10 13.5, 4 14
            Z
          " />
          <circle cx="12" cy="6" r="1.2" fill="#1a1a1a" />
        </svg>
      </div>
    </div>

    <div class="card">
      <h3>2. The Minimal Line</h3>
      <div class="stage">
        <svg viewBox="0 0 28 16">
          <path class="outline" d="
            M 5 14
            C 5 11, 7 9, 8 9
            C 8 6, 10 4, 12 4
            C 14 4, 15 5, 16 6
            C 19 6, 22 7, 24 10
            C 25 12, 24 14, 22 14
          " />
          <circle cx="12" cy="6.5" r="1" class="solid" />
        </svg>
      </div>
    </div>

    <div class="card">
      <h3>3. The Geometric Toad</h3>
      <div class="stage">
        <svg viewBox="0 0 28 16">
          <path class="solid" d="
            M 5 14
            A 4 4 0 0 1 9 10
            A 4 4 0 0 1 13 4
            A 4 4 0 0 1 17 7
            A 6 6 0 0 1 23 9
            A 3 3 0 0 1 25 14
            Z
          " />
          <circle cx="13" cy="6" r="1" fill="#1a1a1a" />
        </svg>
      </div>
    </div>

  </div>
</body>
</html>
