# Publishes the toad.computer image the desktop pulls on first enable.
#
# The computer is its own product with its own version: the number in the
# MCP Implementation stamp (computer/cmd/computer-agent/serve.go). The
# desktop pins a published tag as a dependency (`COMPUTER_VERSION` in
# src/bun/computer/manager.ts) and upgrades on its own schedule. So this
# runs on the computer's release tag (`computer-v*`), not the app's —
# the image must exist before any desktop pins it.
#
# Multi-arch on purpose: Apple Silicon and ARM Linux run linux containers
# natively; shipping amd64-only would make their desktops emulate a
# desktop.
#
# Auth is the workflow's own GITHUB_TOKEN — no PAT. The existing
# `toad-computer` package must grant this repository Write access
# (package settings → Manage Actions access), because it was created by
# a hand push and packages do not trust repos they were not born from.
name: computer-image

on:
  push:
    tags: ["computer-v*"]
  # Hand-runs: backfill a version or re-publish after an image-only fix.
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to publish, e.g. 0.2.0 (no leading computer-v)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            v="${{ inputs.version }}"
          else
            v="${GITHUB_REF_NAME#computer-v}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # The image's one version of record is the Implementation stamp the
      # agent announces over MCP. A tag that disagrees would publish an
      # image that introduces itself as something else. Fail here, loudly.
      - name: Version must match the agent's Implementation stamp
        if: github.event_name == 'push'
        run: |
          stamp="$(sed -n 's/.*Name: "toad-computer", Version: "\([^"]*\)".*/\1/p' computer/cmd/computer-agent/serve.go)"
          if [ "$stamp" != "${{ steps.version.outputs.version }}" ]; then
            echo "tag says ${{ steps.version.outputs.version }}, serve.go stamps $stamp" >&2
            exit 1
          fi

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: computer
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/1broseidon/toad-computer:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
